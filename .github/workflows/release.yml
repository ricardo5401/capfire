# Release workflow — triggered on pushing a `v*` tag (e.g. `v0.1.0`).
#
# Cross-compiles the Go client for Linux and macOS on amd64 + arm64, builds
# .deb packages for the Linux targets, generates checksums, and publishes
# everything as a GitHub Release.
#
# How to cut a release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# GitHub Actions takes it from there. The resulting release exposes:
#
#   capfire-v0.1.0-linux-amd64.tar.gz
#   capfire-v0.1.0-linux-arm64.tar.gz
#   capfire-v0.1.0-darwin-amd64.tar.gz
#   capfire-v0.1.0-darwin-arm64.tar.gz
#   capfire_0.1.0_amd64.deb
#   capfire_0.1.0_arm64.deb
#   checksums.txt

name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------------
  # Build the Go binary for each OS/arch combination, upload as artifact.
  # ------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: amd64, runner: ubuntu-latest }
          - { os: linux,  arch: arm64, runner: ubuntu-latest }
          - { os: darwin, arch: amd64, runner: macos-latest  }
          - { os: darwin, arch: arm64, runner: macos-latest  }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: client/go.sum

      - name: Build binary
        working-directory: client
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="capfire-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

          go build -trimpath \
            -ldflags "-s -w -X github.com/ricardo5401/capfire/client/cmd.Version=${VERSION}" \
            -o capfire .

          tar -czf "../${ARCHIVE}" capfire
          cd ..
          # shasum works on both Linux and macOS; sha256sum is Linux-only.
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: capfire-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            capfire-*.tar.gz
            capfire-*.tar.gz.sha256
          retention-days: 1

  # ------------------------------------------------------------------------
  # Build .deb packages for Linux amd64 and arm64 using nfpm.
  # ------------------------------------------------------------------------
  package-deb:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: capfire-linux-${{ matrix.arch }}
          path: downloaded

      - name: Extract binary
        run: |
          mkdir -p staging
          tar -xzf downloaded/capfire-*-linux-${{ matrix.arch }}.tar.gz -C staging

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.38.0
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm

      - name: Build .deb
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Strip leading 'v' from semver — .deb versions follow Debian policy.
          export VERSION_NUMBER="${VERSION#v}"
          envsubst < packaging/debian/nfpm.yaml.tmpl > /tmp/nfpm.yaml
          mkdir -p dist
          nfpm pkg --packager deb --config /tmp/nfpm.yaml --target "dist/capfire_${VERSION_NUMBER}_${ARCH}.deb"
          shasum -a 256 dist/*.deb > "dist/capfire_${VERSION_NUMBER}_${ARCH}.deb.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: capfire-deb-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          retention-days: 1

  # ------------------------------------------------------------------------
  # Aggregate artifacts, build checksums.txt, publish the release.
  # ------------------------------------------------------------------------
  release:
    needs: [ build, package-deb ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Consolidate checksums
        working-directory: dist
        run: |
          cat *.sha256 | sort > checksums.txt
          rm -f *.sha256

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/capfire-*.tar.gz
            dist/capfire_*.deb
            dist/checksums.txt

  # ------------------------------------------------------------------------
  # Push the updated formula to the homebrew-capfire tap so users running
  # `brew upgrade capfire` get the new release without waiting for a
  # manual edit.
  #
  # Idempotent: if the formula already carries this version + checksums,
  # the diff is empty and we skip the push entirely. That makes the job
  # safe to re-run from the GitHub Actions UI when something downstream
  # of `release` flakes out.
  #
  # Authentication: HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to
  # the homebrew-capfire repo with Contents:write. See docs/release.md
  # for the one-time setup.
  # ------------------------------------------------------------------------
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    # Skip when the secret isn't configured (e.g. during initial bootstrap
    # of a fork) so the rest of the workflow still publishes successfully.
    # The job is also a no-op for non-tag pushes by virtue of the workflow
    # trigger, which is restricted to `tags: [ 'v*' ]`.
    if: ${{ github.repository == 'ricardo5401/capfire' }}
    env:
      VERSION: ${{ github.ref_name }}
      TAP_REPO: ricardo5401/homebrew-capfire
    steps:
      # Pull the freshly published artifacts so we can re-derive the
      # checksums independently. Using checksums.txt from the release
      # avoids having to download every tarball just to shasum it again.
      - name: Download checksums.txt from the release we just cut
        run: |
          mkdir -p tap-sync
          curl -fsSL \
            "https://github.com/ricardo5401/capfire/releases/download/${VERSION}/checksums.txt" \
            -o tap-sync/checksums.txt
          echo "Checksums received:"
          cat tap-sync/checksums.txt

      - name: Clone homebrew-capfire
        env:
          # Token usage: passing it via x-access-token gives git an HTTPS
          # auth method that works without configuring a credential
          # helper. Using $GITHUB_ACTOR as the username is fine — Git
          # only looks at the password half for token auth.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured in repository secrets."
            echo "::error::See docs/release.md for the one-time setup of the fine-grained PAT."
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap

      - name: Render Formula/capfire.rb from the published checksums
        # All the file-rewriting logic lives in this step (instead of
        # being smeared across multiple shell snippets) so the
        # transformation is auditable as a single block. The script
        # writes the new formula in place; the next step decides whether
        # it differs from what's in the tap.
        run: |
          set -euo pipefail

          VERSION_NO_V="${VERSION#v}"

          # Parse checksums.txt — each line is `<sha256>  <filename>`.
          # We pluck the four tarball variants by exact filename match
          # so a future addition (say, a windows tarball) doesn't
          # silently break this step.
          extract_sha() {
            local target="$1"
            local sha
            sha="$(awk -v t="$target" '$2 == t { print $1; exit }' tap-sync/checksums.txt)"
            if [ -z "$sha" ]; then
              echo "::error::missing checksum for $target in checksums.txt"
              exit 1
            fi
            printf '%s' "$sha"
          }

          SHA_DARWIN_AMD64="$(extract_sha "capfire-${VERSION}-darwin-amd64.tar.gz")"
          SHA_DARWIN_ARM64="$(extract_sha "capfire-${VERSION}-darwin-arm64.tar.gz")"
          SHA_LINUX_AMD64="$(extract_sha "capfire-${VERSION}-linux-amd64.tar.gz")"
          SHA_LINUX_ARM64="$(extract_sha "capfire-${VERSION}-linux-arm64.tar.gz")"

          mkdir -p tap/Formula

          # Heredoc the whole formula. Building from a template (rather
          # than sed-ing the existing one) means we never inherit a
          # half-edited state from a prior failed run.
          cat > tap/Formula/capfire.rb <<EOF
          # Auto-generated by capfire's release workflow. Do not edit by
          # hand — changes will be overwritten on the next release.
          # Source template: packaging/homebrew/capfire.rb in
          # https://github.com/ricardo5401/capfire
          class Capfire < Formula
            desc "JWT-authenticated deploy orchestrator — developer CLI"
            homepage "https://github.com/ricardo5401/capfire"
            version "${VERSION_NO_V}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/ricardo5401/capfire/releases/download/${VERSION}/capfire-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
              on_arm do
                url "https://github.com/ricardo5401/capfire/releases/download/${VERSION}/capfire-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/ricardo5401/capfire/releases/download/${VERSION}/capfire-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              on_arm do
                url "https://github.com/ricardo5401/capfire/releases/download/${VERSION}/capfire-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "capfire"
            end

            test do
              assert_match "capfire version", shell_output("#{bin}/capfire --version")
            end
          end
          EOF

          echo "Generated formula:"
          cat tap/Formula/capfire.rb

      - name: Commit + push to the tap (idempotent)
        working-directory: tap
        run: |
          set -euo pipefail

          # `git diff --quiet` exits non-zero when there's a diff. We
          # invert that into a clean "should we push?" boolean so the
          # job is a no-op when the formula is already up to date —
          # critical for re-runs after a transient failure.
          if git diff --quiet Formula/capfire.rb; then
            echo "Formula already at ${VERSION}; nothing to push."
            exit 0
          fi

          # Identity is purely for the commit object. We use the
          # github-actions[bot] convention so the commit doesn't look
          # like it came from a real human reviewer.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/capfire.rb
          git commit -m "release: bump to ${VERSION}" \
                     -m "Source: https://github.com/ricardo5401/capfire/releases/tag/${VERSION}"
          git push origin HEAD:main
